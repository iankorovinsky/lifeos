name: Deploy Trigger.dev

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Get Trigger.dev version
        id: trigger-version
        run: echo "version=$(bun pm ls @trigger.dev/sdk | grep @trigger.dev/sdk | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Deploy to Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: bunx trigger.dev@${{ steps.trigger-version.outputs.version }} deploy
